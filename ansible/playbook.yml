
---
- name: Configurar los cinco servidores Ubuntu
  hosts: servidores
  become: true
  gather_facts: true

  tasks:

    - name: Actualizar la cache de APT
      ansible.builtin.apt:
        update_cache: yes

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        create_home: yes
        shell: /bin/bash

    - name: Crear la carpeta app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: Crear el archivo hola.txt
      ansible.builtin.copy:
        dest: /home/itla/app/hola.txt
        content: "Hola desde Ansible en Ubuntu!"
        owner: itla
        group: itla
        mode: '0644'

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
